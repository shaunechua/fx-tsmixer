[project]
name = "fx-forecasting"
version = "0.1.0"
description = "USD/JPY forecasting and trading research pipeline"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2.0",
    "polars>=1.43.2",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.7.0",
    "statsmodels>=0.14.6",
    "torch>=2.8.0",
    "matplotlib>=3.11.1",
    "plotly>=6.9.0",
    "nbformat>=5.11.1",
    "ipykernel>=7.3.0",
    "darts[torch]>=0.46.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
fx-runner = "fx_forecasting.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fx_forecasting"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
explicit_package_bases = true
mypy_path = "src"
python_version = "3.12"
strict = true
files = ["src/fx_forecasting"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["darts.*", "statsmodels.*", "sklearn.*", "torch.*"]
ignore_missing_imports = true
