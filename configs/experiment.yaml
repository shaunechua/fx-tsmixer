seed: 42
output_dir: outputs

periods:
  development_end: 2021-12-31
  validation_start: 2022-01-03
  validation_end: 2023-12-29
  final_test_start: 2024-01-02
  final_test_end: 2025-12-31

purge_business_days: 1

datasets:
  fx_spot:
    path: data/fx_spot.csv
    date_column: observation_date
    value_column: DEXJPUS
    availability_lag: 0
    availability_lag_unit: business_days
    maximum_staleness_days: 0
  us_rate:
    path: data/us_rate.csv
    date_column: observation_date
    value_column: DFF
    availability_lag: 1
    availability_lag_unit: business_days
    maximum_staleness_days: 7
  jp_rate:
    path: data/jp_rate.csv
    date_column: observation_date
    value_column: IRSTCI01JPM156N
    availability_lag: 31
    availability_lag_unit: calendar_days
    maximum_staleness_days: 93
  nikkei:
    path: data/nikkei.csv
    date_column: observation_date
    value_column: NIKKEI225
    availability_lag: 1
    availability_lag_unit: business_days
    maximum_staleness_days: 7
  us_cpi:
    path: data/us_cpi.csv
    date_column: observation_date
    value_column: CPIAUCSL
    availability_lag: 45
    availability_lag_unit: calendar_days
    maximum_staleness_days: 93
  us_curve_10y2y:
    path: data/us_curve_10y2y.csv
    date_column: observation_date
    value_column: T10Y2Y
    availability_lag: 1
    availability_lag_unit: business_days
    maximum_staleness_days: 7
  us_indpro:
    path: data/us_indpro.csv
    date_column: observation_date
    value_column: INDPRO
    availability_lag: 45
    availability_lag_unit: calendar_days
    maximum_staleness_days: 93
  vix:
    path: data/vix.csv
    date_column: observation_date
    value_column: VIXCLS
    availability_lag: 1
    availability_lag_unit: business_days
    maximum_staleness_days: 7
  wti:
    path: data/wti.csv
    date_column: observation_date
    value_column: DCOILWTICO
    availability_lag: 1
    availability_lag_unit: business_days
    maximum_staleness_days: 7

missing_values:
  - ""
  - "."
  - NA
  - N/A

models:
  arima:
    max_p: 2
    max_q: 2
    maximum_iterations: 200
  tsmixer:
    lookback: 32
    hidden_size: 64
    mixer_blocks: 2
    dropout: 0.1
    learning_rate: 0.001
    weight_decay: 0.0001
    gradient_clip: 1.0
    batch_size: 64
    maximum_epochs: 100
    early_stopping_patience: 10
    early_stopping_min_delta: 0.0001
    feature_sets:
      tsmixer: []
      tsmixer_external:
        [ 
          nikkei_return_1, vix, vix_change_1,
          wti_return_1,
          us_cpi_growth, us_indpro_growth, us_curve_10y2y, us_curve_10y2y_change_1,
        ]

signal_threshold: 0.0
transaction_cost: 0.0001
annualization_periods: 252
